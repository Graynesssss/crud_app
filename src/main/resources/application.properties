spring.application.name=crudapplication

# Настройки подключения к базе данных (укажите свои параметры)
spring.datasource.url=jdbc:postgresql://localhost:5433/CRUDAPP
spring.datasource.username=postgres
spring.datasource.password=jsfjskdhJISFNin3285289NFN3253H


# Отключение OSIV (good practice для продакшена)
spring.jpa.open-in-view=false

# Дополнительно можно включить отображение SQL-запросов в консоли для удобства отладки
spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update

# Отключаем контейнер с postgre
spring.docker.compose.enabled=false

# Включаем Liquibase
spring.liquibase.enabled=true

# Путь к главному файлу-диспетчеру миграций (changelog)
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# Отключаем автоматическое создание таблиц Hibernate, так как теперь за это отвечает Flyway
#spring.jpa.hibernate.ddl-auto=validate

# Полностью отключаем генерацию схемы Hibernate
spring.jpa.hibernate.ddl-auto=none

# Настройки Flyway (включаем его и указываем игнорирование пустых таблиц, если они уже были созданы ранее)
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
